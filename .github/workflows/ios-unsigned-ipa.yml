name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify public assets
        run: |
          test ! -e .env.local
          test ! -e public/assets/people/gym-photo-1.jpg
          test ! -e public/assets/people/gym-photo-2.jpg
          test ! -e public/assets/gym-lounge-photo.png
          test ! -e public/assets/gym-lockers-photo.png
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: Build iPhoneOS app without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/App.app
          cd build
          zip -qry FindAndSort-unsigned.ipa Payload
          unzip -t FindAndSort-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FindAndSort-unsigned-ipa
          path: build/FindAndSort-unsigned.ipa
          if-no-files-found: error
